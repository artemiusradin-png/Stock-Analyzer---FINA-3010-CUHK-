<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Connection Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-result {
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid;
        }
        .success {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }
        .error {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }
        .warning {
            background: #fef3c7;
            border-color: #f59e0b;
            color: #92400e;
        }
        .info {
            background: #dbeafe;
            border-color: #3b82f6;
            color: #1e40af;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover {
            background: #2563eb;
        }
        pre {
            background: #1f2937;
            color: #f9fafb;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 14px;
        }
        h1 {
            color: #1f2937;
        }
    </style>
</head>
<body>
    <h1>🔍 Backend Connection Test</h1>
    <p>This page tests the connection to your backend API.</p>
    
    <button onclick="testConnection()">Test Backend Connection</button>
    <button onclick="testAllEndpoints()">Test All Endpoints</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script>
        const BACKEND_URL = 'https://arqam-backend.onrender.com';
        const resultsDiv = document.getElementById('results');

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = message;
            resultsDiv.appendChild(div);
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        async function testConnection() {
            clearResults();
            addResult('🔄 Testing backend connection...', 'info');
            
            const endpoints = [
                { name: 'Health Check', url: `${BACKEND_URL}/health`, method: 'GET' },
                { name: 'Root Endpoint', url: `${BACKEND_URL}/`, method: 'GET' }
            ];

            for (const endpoint of endpoints) {
                try {
                    const startTime = Date.now();
                    const response = await fetch(endpoint.url, {
                        method: endpoint.method,
                        mode: 'cors',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    const duration = Date.now() - startTime;
                    
                    if (response.ok) {
                        const data = await response.json();
                        addResult(`
                            <strong>✅ ${endpoint.name} - SUCCESS</strong><br>
                            <small>URL: ${endpoint.url}</small><br>
                            <small>Status: ${response.status} ${response.statusText}</small><br>
                            <small>Response Time: ${duration}ms</small><br>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `, 'success');
                    } else {
                        addResult(`
                            <strong>❌ ${endpoint.name} - FAILED</strong><br>
                            <small>URL: ${endpoint.url}</small><br>
                            <small>Status: ${response.status} ${response.statusText}</small>
                        `, 'error');
                    }
                } catch (error) {
                    addResult(`
                        <strong>❌ ${endpoint.name} - ERROR</strong><br>
                        <small>URL: ${endpoint.url}</small><br>
                        <small>Error: ${error.message}</small><br>
                        <small>Type: ${error.name}</small>
                    `, 'error');
                }
            }

            // Test CORS
            addResult('🔄 Testing CORS configuration...', 'info');
            try {
                const response = await fetch(`${BACKEND_URL}/health`, {
                    method: 'OPTIONS',
                    mode: 'cors'
                });
                addResult(`
                    <strong>✅ CORS Preflight - SUCCESS</strong><br>
                    <small>Status: ${response.status}</small>
                `, 'success');
            } catch (error) {
                addResult(`
                    <strong>⚠️ CORS Preflight - WARNING</strong><br>
                    <small>Error: ${error.message}</small><br>
                    <small>This may be normal if backend doesn't handle OPTIONS</small>
                `, 'warning');
            }
        }

        async function testAllEndpoints() {
            clearResults();
            addResult('🔄 Testing all API endpoints...', 'info');

            const endpoints = [
                { name: 'Health Check', url: `${BACKEND_URL}/health` },
                { name: 'Root', url: `${BACKEND_URL}/` },
                { name: 'Valuations Calculate', url: `${BACKEND_URL}/api/valuations/calculate`, method: 'POST', body: { ticker: 'AAPL' } },
                { name: 'Assets Info', url: `${BACKEND_URL}/api/assets/AAPL` },
            ];

            for (const endpoint of endpoints) {
                try {
                    const options = {
                        method: endpoint.method || 'GET',
                        mode: 'cors',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        }
                    };

                    if (endpoint.body) {
                        options.body = JSON.stringify(endpoint.body);
                    }

                    const startTime = Date.now();
                    const response = await fetch(endpoint.url, options);
                    const duration = Date.now() - startTime;

                    if (response.ok) {
                        const data = await response.json();
                        addResult(`
                            <strong>✅ ${endpoint.name}</strong><br>
                            <small>${endpoint.url}</small><br>
                            <small>Status: ${response.status} | Time: ${duration}ms</small>
                        `, 'success');
                    } else {
                        addResult(`
                            <strong>⚠️ ${endpoint.name}</strong><br>
                            <small>${endpoint.url}</small><br>
                            <small>Status: ${response.status} ${response.statusText}</small>
                        `, 'warning');
                    }
                } catch (error) {
                    addResult(`
                        <strong>❌ ${endpoint.name}</strong><br>
                        <small>${endpoint.url}</small><br>
                        <small>Error: ${error.message}</small>
                    `, 'error');
                }
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            addResult('📋 Backend URL: ' + BACKEND_URL, 'info');
            addResult('📍 Current Origin: ' + window.location.origin, 'info');
            setTimeout(testConnection, 1000);
        });
    </script>
</body>
</html>
