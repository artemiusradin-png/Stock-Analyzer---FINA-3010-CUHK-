services:
  # Backend API
  - type: web
    name: arqam-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: EOD_API_KEY
        sync: false
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO

  # Static Frontend
  - type: web
    name: arqam-frontend
    env: static
    staticPublishPath: ./frontend/public
    buildCommand: echo "No build needed"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://arqam-backend.onrender.com/api/*
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=31536000

databases:
  # PostgreSQL Database
  - name: arqam-db
    plan: free
    databaseName: arqam
    user: postgres

