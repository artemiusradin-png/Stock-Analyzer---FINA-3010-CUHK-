<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tab Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .test { margin: 20px 0; padding: 15px; background: white; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f0f0f0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>Tab Switching Debug Test</h1>

    <div class="test">
        <h2>Test 1: Check if portfolio-module.js loads</h2>
        <button onclick="test1()">Run Test 1</button>
        <div id="test1-result" class="result"></div>
    </div>

    <div class="test">
        <h2>Test 2: Check if initNPVTabs exists</h2>
        <button onclick="test2()">Run Test 2</button>
        <div id="test2-result" class="result"></div>
    </div>

    <div class="test">
        <h2>Test 3: Check tab buttons on main page</h2>
        <button onclick="test3()">Run Test 3</button>
        <div id="test3-result" class="result"></div>
    </div>

    <div class="test">
        <h2>Test 4: Manually trigger tab switch</h2>
        <button onclick="test4()">Run Test 4</button>
        <div id="test4-result" class="result"></div>
    </div>

    <script src="js/portfolio-module.js"></script>

    <script>
        function test1() {
            const result = document.getElementById('test1-result');
            result.innerHTML = `
                <strong>portfolio-module.js loaded:</strong> ${typeof getPortfolioAPIBase !== 'undefined' ? 'YES' : 'NO'}<br>
                <strong>calculateDCF exists:</strong> ${typeof calculateDCF !== 'undefined' ? 'YES' : 'NO'}<br>
                <strong>window.calculateDCF exists:</strong> ${typeof window.calculateDCF !== 'undefined' ? 'YES' : 'NO'}<br>
                <strong>optimizePortfolio exists:</strong> ${typeof optimizePortfolio !== 'undefined' ? 'YES' : 'NO'}<br>
                <strong>analyzeSentiment exists:</strong> ${typeof analyzeSentiment !== 'undefined' ? 'YES' : 'NO'}
            `;
        }

        function test2() {
            const result = document.getElementById('test2-result');
            // Check if the function exists in the module scope
            const script = document.createElement('script');
            script.textContent = `
                if (typeof initNPVTabs === 'function') {
                    document.getElementById('test2-result').innerHTML = 'initNPVTabs function exists';
                } else {
                    document.getElementById('test2-result').innerHTML = 'initNPVTabs function NOT found (it might be in module scope)';
                }
            `;
            document.body.appendChild(script);
        }

        function test3() {
            fetch('http://localhost:3000/project-npv.html')
                .then(r => r.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const tabButtons = doc.querySelectorAll('.npv-tab-btn');
                    const tabContents = doc.querySelectorAll('.npv-tab-content');

                    document.getElementById('test3-result').innerHTML = `
                        <strong>Tab buttons found:</strong> ${tabButtons.length}<br>
                        <strong>Tab content divs found:</strong> ${tabContents.length}<br>
                        <strong>Buttons:</strong><br>
                        ${Array.from(tabButtons).map(btn =>
                            `- "${btn.textContent.trim()}" (data-tab="${btn.dataset.tab}")`
                        ).join('<br>')}
                    `;
                })
                .catch(e => {
                    document.getElementById('test3-result').innerHTML = `Error: ${e.message}`;
                });
        }

        function test4() {
            // Open the main page and try to click a tab
            window.open('http://localhost:3000/project-npv.html', '_blank');
            document.getElementById('test4-result').innerHTML = `
                Opened project-npv.html in new tab.<br>
                <strong>Instructions:</strong><br>
                1. Switch to the new tab<br>
                2. Open console (F12)<br>
                3. Try: <code>document.querySelectorAll('.npv-tab-btn')</code><br>
                4. Try: <code>document.querySelectorAll('.npv-tab-btn')[1].click()</code>
            `;
        }
    </script>
</body>
</html>
