<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCF Valuation Tool</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 2.5em;
            font-weight: 300;
        }
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        .content {
            padding: 40px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .results {
            margin-top: 30px;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .results h3 {
            margin-top: 0;
            color: #333;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e1e5e9;
        }
        .metric:last-child {
            border-bottom: none;
        }
        .metric-label {
            font-weight: 600;
            color: #555;
        }
        .metric-value {
            font-weight: 700;
            color: #333;
        }
        .positive {
            color: #28a745;
        }
        .negative {
            color: #dc3545;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>DCF Valuation Tool</h1>
            <p>Discounted Cash Flow Analysis for Stock Valuation</p>
        </div>
        
        <div class="content">
            <form id="dcfForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="ticker">Stock Ticker</label>
                        <input type="text" id="ticker" name="ticker" placeholder="e.g., AAPL, MSFT, GOOGL" required>
                    </div>
                    <div class="form-group">
                        <label for="years">Forecast Period (Years)</label>
                        <input type="number" id="years" name="years" value="10" min="5" max="20">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="terminal_growth">Terminal Growth Rate (%)</label>
                        <input type="number" id="terminal_growth" name="terminal_growth" value="2.5" step="0.1" min="0" max="10">
                    </div>
                    <div class="form-group">
                        <label for="wacc">WACC/Discount Rate (%)</label>
                        <input type="number" id="wacc" name="wacc" value="8.0" step="0.1" min="0" max="30">
                    </div>
                </div>
                
                <button type="submit" class="btn" id="calculateBtn">
                    Calculate DCF Valuation
                </button>
            </form>
            
            <div id="loading" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Calculating DCF valuation...</p>
            </div>
            
            <div id="results" class="results" style="display: none;">
                <h3>DCF Valuation Results</h3>
                <div id="resultsContent"></div>
            </div>
            
            <div id="error" class="error" style="display: none;">
                <strong>Error:</strong> <span id="errorMessage"></span>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('dcfForm');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        const calculateBtn = document.getElementById('calculateBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Show loading
            loading.style.display = 'block';
            results.style.display = 'none';
            error.style.display = 'none';
            calculateBtn.disabled = true;
            
            // Get form data
            const formData = new FormData(form);
            const data = {
                ticker: formData.get('ticker').toUpperCase(),
                years: parseInt(formData.get('years')),
                terminal_growth: parseFloat(formData.get('terminal_growth')) / 100,
                wacc: parseFloat(formData.get('wacc')) / 100
            };
            
            try {
                const response = await fetch('http://localhost:8080/api/dcf/calculate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    displayResults(result.data);
                } else {
                    showError(result.error || 'Unknown error occurred');
                }
            } catch (err) {
                showError('Failed to connect to DCF API. Make sure the server is running on port 8080.');
            } finally {
                loading.style.display = 'none';
                calculateBtn.disabled = false;
            }
        });
        
        function displayResults(data) {
            const resultsContent = document.getElementById('resultsContent');
            
            const upsideDownside = data.upside_downside;
            const upsideClass = upsideDownside > 0 ? 'positive' : 'negative';
            
            resultsContent.innerHTML = `
                <div class="metric">
                    <span class="metric-label">Company:</span>
                    <span class="metric-value">${data.company_name}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Current Price:</span>
                    <span class="metric-value">$${data.current_price.toFixed(2)}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Implied Price:</span>
                    <span class="metric-value">$${data.implied_price.toFixed(2)}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Upside/Downside:</span>
                    <span class="metric-value ${upsideClass}">${upsideDownside.toFixed(1)}%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Enterprise Value:</span>
                    <span class="metric-value">$${data.enterprise_value.toFixed(2)}B</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Equity Value:</span>
                    <span class="metric-value">$${data.equity_value.toFixed(2)}B</span>
                </div>
                <div class="metric">
                    <span class="metric-label">WACC:</span>
                    <span class="metric-value">${data.wacc.toFixed(2)}%</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Beta:</span>
                    <span class="metric-value">${data.beta.toFixed(2)}</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Terminal Value:</span>
                    <span class="metric-value">$${data.terminal_value.toFixed(2)}B</span>
                </div>
            `;
            
            results.style.display = 'block';
        }
        
        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            error.style.display = 'block';
        }
    </script>
</body>
</html>
