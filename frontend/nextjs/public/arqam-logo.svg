<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric icon on the left -->
  <g id="icon">
    <!-- Abstract geometric shape representing financial growth/analytics -->
    <path d="M15 45 L25 35 L35 40 L45 25 L45 45 Z" fill="url(#gradient1)" opacity="0.8"/>
    <path d="M15 30 L25 20 L35 25 L45 10 L45 30 Z" fill="url(#gradient2)" opacity="0.6"/>
    <circle cx="25" cy="35" r="2.5" fill="#3b82f6"/>
    <circle cx="35" cy="40" r="2.5" fill="#3b82f6"/>
    <circle cx="45" cy="25" r="2.5" fill="#3b82f6"/>
  </g>

  <!-- ARQAM text -->
  <g id="text">
    <text x="60" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="2" fill="#1e293b">
      ARQAM
    </text>
    <!-- Subtitle -->
    <text x="60" y="52" font-family="Arial, sans-serif" font-size="10" font-weight="400" letter-spacing="3" fill="#64748b">
      FINANCIAL ANALYTICS
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="15" y1="25" x2="45" y2="45" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="15" y1="10" x2="45" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
</svg>
