<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 1200px;
            height: 630px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .container {
            text-align: center;
            color: white;
        }
        .icon {
            margin-bottom: 30px;
        }
        .logo-text {
            font-size: 120px;
            font-weight: 800;
            letter-spacing: 8px;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 36px;
            letter-spacing: 6px;
            opacity: 0.9;
            font-weight: 400;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg width="200" height="120" viewBox="0 0 200 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 100 L80 70 L110 80 L140 50 L140 100 Z" fill="rgba(255,255,255,0.3)"/>
            <path d="M50 70 L80 40 L110 50 L140 20 L140 70 Z" fill="rgba(255,255,255,0.2)"/>
            <circle cx="80" cy="70" r="8" fill="white"/>
            <circle cx="110" cy="80" r="8" fill="white"/>
            <circle cx="140" cy="50" r="8" fill="white"/>
        </svg>
        <div class="logo-text">ARQAM</div>
        <div class="subtitle">FINANCIAL ANALYTICS</div>
    </div>
</body>
</html>
