<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Stylized "A" mark with integrated chart -->
  <g transform="translate(4, 4)">
    <!-- Main "A" triangle shape -->
    <path d="M22 40 L4 40 L22 4 L40 40 L22 40"
          fill="none" stroke="#0f172a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- Horizontal bar of the A -->
    <line x1="12" y1="28" x2="32" y2="28" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Rising trend arrow emerging from A -->
    <path d="M26 24 L34 12 L38 12" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M34 16 L38 12 L34 12" fill="#0f172a"/>
  </g>

  <!-- ARQAM wordmark -->
  <text x="54" y="32" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="26" font-weight="700" letter-spacing="2.5" fill="#0f172a">
    ARQAM
  </text>
</svg>
