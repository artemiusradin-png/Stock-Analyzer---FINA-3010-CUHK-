<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular mark with ascending bars -->
  <g transform="translate(4, 4)">
    <!-- Circle frame -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#0f172a" stroke-width="2.2"/>

    <!-- Three ascending bars representing growth -->
    <rect x="9" y="22" width="5" height="10" rx="1" fill="#0f172a"/>
    <rect x="17.5" y="16" width="5" height="16" rx="1" fill="#0f172a"/>
    <rect x="26" y="10" width="5" height="22" rx="1" fill="#0f172a"/>
  </g>

  <!-- ARQAM wordmark -->
  <text x="52" y="32" font-family="system-ui, -apple-system, 'SF Pro Display', 'Segoe UI', sans-serif"
        font-size="26" font-weight="700" letter-spacing="2.5" fill="#0f172a">
    ARQAM
  </text>
</svg>
